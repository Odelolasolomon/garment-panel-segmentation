apiVersion: batch/v1
kind: Job
metadata:
  name: panel-seg-latency-benchmark
  namespace: panel-seg
  labels:
    app.kubernetes.io/name: panel-seg
    app.kubernetes.io/component: benchmark
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: ghcr.io/your-org/panel-seg:latest
          command: ["python", "benchmark_latency.py"]
          args:
            - "--weights"
            - "/app/weights/best.pt"
            - "--image"
            - "/app/samples/sample.jpg"
            - "--runs"
            - "50"
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
          volumeMounts:
            - name: model-weights
              mountPath: /app/weights
              readOnly: true
            - name: samples
              mountPath: /app/samples
              readOnly: true
      volumes:
        - name: model-weights
          persistentVolumeClaim:
            claimName: panel-seg-models
        - name: samples
          persistentVolumeClaim:
            claimName: panel-seg-samples
