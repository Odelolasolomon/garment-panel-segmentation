services:
  panel-seg-api:
    build: .
    image: panel-seg:local
    ports:
      - "8080:8080"
    environment:
      MODEL_WEIGHTS: /app/weights/best.pt
      SERVICE_NAME: panel-seg-local
    volumes:
      - ./weights:/app/weights:ro
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s